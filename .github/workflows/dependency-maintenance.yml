name: Dependency Maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-next:
    if: "!contains(github.event.head_commit.message, 'Update Next.js')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: streamverse/package-lock.json
      - run: npm install next@16.3.6 eslint-config-next@16.3.6 --save-exact
      - run: npm audit fix --package-lock-only || true
      - name: Commit dependency updates
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamverse/package.json streamverse/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Next.js and dependency lockfile"
          git push
